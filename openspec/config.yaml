schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  Producto: Tandem — plataforma para crear formularios configurables,
  compartirlos para que cualquiera los rellene, y consultar las respuestas
  recibidas en un mismo lugar. Sin cuentas de usuario ni roles en el MVP:
  el acceso a la app (web y API) está protegido por una contraseña general
  compartida. Ver docs/prd.md (PRD completo) y docs/modelo-datos.md (modelo
  de datos y reglas de negocio) para el detalle; este contexto resume lo que
  hay que tener presente al proponer cambios.

  Arquitectura: backend que expone la API REST del dominio, y frontend web
  (SPA) que la consume. Stack decidido con versiones fijadas (ver
  docs/backend.md y docs/frontend.md para el detalle completo y la
  justificación de cada elección):
  - Backend: TypeScript 6.0.x + NestJS 11.x sobre Node.js 24.x LTS,
    PostgreSQL 18.x con Prisma 7.x como ORM, IDs ULID (`ulid` npm),
    validación con `class-validator`/`class-transformer`, API REST
    documentada con OpenAPI vía `@nestjs/swagger` (contrato usado para
    generar el cliente TypeScript del frontend con `openapi-typescript`),
    autenticación por contraseña compartida (`APP_PASSWORD`) con token de
    sesión JWT (`@nestjs/jwt`) validado por un `AuthGuard` global en todos
    los endpoints salvo `POST /api/v1/auth/login`, contenedores Docker,
    pnpm 11.x, ESLint 10 (flat config) + Prettier 3, testing con Jest +
    Supertest.
  - Arquitectura del backend: dominio esencialmente CRUD (FormType,
    FormField, Form, FormResponse), sin máquina de estados ni reglas de
    negocio complejas; todos los módulos siguen el mismo patrón simple
    Controller -> Service -> Prisma, sin capa de dominio ni repositorio
    propio. Módulos: FormTypesModule, FormFieldsModule, FormsModule,
    FormResponsesModule. Ver docs/backend.md §3.
  - Frontend: React 19.x + Vite 7.x como SPA (client-side rendering, sin
    SSR), TanStack Router (rutas tipadas) + TanStack Query (data fetching/
    caché de servidor), cliente API tipado generado con `openapi-typescript`
    a partir del contrato del backend, Mantine 8.x como librería de
    componentes UI, formularios con `@mantine/form` + Zod, testing con
    Vitest + React Testing Library (unit/componentes) y Playwright (e2e),
    ESLint 10 + Prettier 3, pnpm 11.x. Distribución como build estático
    (`vite build`), sin runtime Node en producción. Ver docs/frontend.md.
  - CI/CD: GitHub Actions en ambos (lint + typecheck + tests en cada PR);
    CD pendiente de la decisión de hosting/infra, que se tratará como su
    propio change de openspec (ver docs/backend.md §10 y docs/frontend.md
    §9).

  Todo cambio que afecte el stack, sus versiones o la arquitectura debe
  mantener consistencia con docs/backend.md y docs/frontend.md (o
  actualizarlos explícitamente si la decisión cambia).

  Entidades del dominio (ver docs/modelo-datos.md para atributos y
  relaciones completas): FormType (tipo de formulario reutilizable, define
  la lista ordenada de campos), FormField (campo individual de un FormType:
  label, field_type [text/textarea/number/boolean/select/multi_select/
  date], is_required, options, order_index), Form (instancia de un
  FormType, se comparte para recibir una respuesta), FormResponse (como
  máximo una por Form; response_data en JSON indexado por field_id,
  guardable de forma incremental y editable después).

  Reglas de negocio clave (ver docs/modelo-datos.md §5 y docs/backend.md
  §6): un Form admite como máximo una FormResponse (los guardados
  sucesivos son upsert sobre esa misma fila, `PUT
  /api/v1/forms/:formId/response`); response_data se puede guardar de
  forma incremental sin necesidad de completar los campos `is_required`
  en cada guardado, esa validación solo determina si la respuesta se
  considera completa, no si el guardado se acepta; no existen
  restricciones de acceso más allá de la contraseña compartida —
  cualquiera puede crear, editar y eliminar FormTypes, FormFields y Forms,
  y rellenar, editar y consultar la respuesta de cualquier Form.

  Alcance MVP (ver docs/prd.md §6): creación, edición y eliminación de
  FormTypes (con sus FormFields); creación, edición y eliminación de Forms
  a partir de un FormType; relleno y guardado incremental de
  FormResponses; listado/consulta de respuestas por formulario; búsqueda
  de formularios por nombre. Explícitamente fuera de alcance inicial:
  cuentas de usuario, autenticación real y roles (la protección por
  contraseña compartida sí es del MVP); control de acceso o visibilidad;
  estados de publicación del formulario; formularios públicos con enlace
  externo; lógica condicional entre campos; exportación de respuestas y
  analítica/agregación; notificaciones; comentarios, adjuntos e historial
  de cambios.

  Requisitos no funcionales a considerar: UX de app web moderna con foco
  en escritorio/laptop (pero sin romperse en tablet); buen rendimiento con
  volúmenes moderados de formularios y respuestas; minimizar pérdida de
  información, especialmente de respuestas enviadas; accesibilidad básica
  (teclado, contraste, semántica); disponibilidad backend objetivo ≥99.5%.

