name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tandem
          POSTGRES_PASSWORD: tandem
          POSTGRES_DB: tandem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tandem -d tandem"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://tandem:tandem@localhost:5432/tandem?schema=public"
      APP_PASSWORD: "ci-password"
      APP_JWT_SECRET: "ci-secret"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter backend prisma:generate

      - name: Lint
        run: pnpm --filter backend lint

      - name: Typecheck
        run: pnpm --filter backend typecheck

      - name: Unit tests
        run: pnpm --filter backend test

      - name: E2E tests
        run: pnpm --filter backend test:e2e

      - name: Build
        run: pnpm --filter backend build
