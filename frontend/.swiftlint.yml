included:
  - TandemApp
  - TandemAppTests
  - TandemAppUITests

excluded:
  - TandemApp.xcodeproj

opt_in_rules:
  - empty_count
  - explicit_init
  - closure_spacing
  - redundant_type_annotation
  - unneeded_parentheses_in_closure_argument

line_length:
  warning: 120
  error: 160

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
